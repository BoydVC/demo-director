<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Canvas Drive Lab</title>
  <style>
    html, body { margin: 0; height: 100%; background: #102018; color: #e8ffe8; font-family: sans-serif; }
    header { position: absolute; top: 8px; left: 12px; z-index: 2; font-size: 18px; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <header>Drive Lab</header>
  <canvas id="c" width="1280" height="800"></canvas>
  <script>
    const c = document.getElementById("c");
    const ctx = c.getContext("2d");
    for (let y = 0; y < c.height; y += 4) {
      for (let x = 0; x < c.width; x += 4) {
        const v = ((x * 13) ^ (y * 29) ^ (x * y)) & 255;
        ctx.fillStyle = `rgb(${40 + (v % 80)}, ${80 + (v % 100)}, ${50 + (v % 60)})`;
        ctx.fillRect(x, y, 4, 4);
      }
    }
    ctx.fillStyle = "#7CFFB2";
    ctx.fillRect(200, 300, 220, 110);
    ctx.fillStyle = "#ff8866";
    ctx.beginPath(); ctx.arc(900, 220, 70, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "32px sans-serif";
    ctx.fillText("lap 1 — keep left", 220, 365);
  </script>
</body>
</html>
