<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Bridge Drill</title>
  <style>
    html, body { margin: 0; height: 100%; background: #06122e; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="c" width="960" height="720"></canvas>
  <script>
    const c = document.getElementById("c");
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#0a1a3a"; ctx.fillRect(0, 0, c.width, c.height);
    for (let i = 0; i < 40; i++) {
      ctx.fillStyle = `hsl(${200 + i * 3}, 70%, ${30 + (i % 10)}%)`;
      ctx.fillRect(20 + i * 22, 80 + (i % 7) * 40, 18, 120);
    }
    ctx.fillStyle = "#f2a900";
    ctx.beginPath(); ctx.arc(480, 520, 48, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "28px sans-serif";
    ctx.fillText("tap to shoot", 400, 360);
  </script>
</body>
</html>
