<!doctype html><html><head><meta charset="utf-8"><title>Kit Check (synthetic)</title>
<style>body{font-family:system-ui;background:#0f172a;color:#e2e8f0;margin:0;padding:40px}
h1{margin:0 0 8px}.sub{color:#94a3b8;margin-bottom:24px}.row{display:flex;gap:12px;margin-bottom:20px}
input{flex:1;padding:14px;border-radius:10px;border:1px solid #334155;background:#1e293b;color:#fff;font-size:18px}
button{padding:14px 22px;border:0;border-radius:10px;background:#f97316;color:#fff;font-weight:700;font-size:18px;cursor:pointer}
button.ghost{background:#334155}.card{background:#1e293b;border-radius:12px;padding:16px 20px;margin-bottom:10px;display:flex;justify-content:space-between}
.tag{background:#334155;border-radius:999px;padding:2px 10px;font-size:14px}#status{color:#4ade80;font-weight:700;min-height:24px;margin-top:8px}</style></head>
<body><h1>Kit Check</h1><div class="sub">Synthetic demo data · Saturday session</div>
<div class="row"><input id="item" placeholder="Add a kit item…"><button id="add">Add</button><button id="ready" class="ghost">Mark ready</button></div>
<div id="list"><div class="card"><span>Cones, orange</span><span class="tag">Packed</span></div>
<div class="card"><span>Pinnies, 12</span><span class="tag">Packed</span></div>
<div class="card"><span>Water jug</span><span class="tag">Packed</span></div></div>
<div id="status"></div>
<script>
document.getElementById("add").onclick=()=>{const item=document.getElementById("item");if(!item.value)return;const d=document.createElement("div");d.className="card";d.innerHTML="<span>"+item.value+"</span><span class='tag'>New</span>";document.getElementById("list").appendChild(d);item.value=""};
document.getElementById("ready").onclick=()=>{document.getElementById("status").textContent="4 items marked ready for Saturday"};
</script></body></html>
