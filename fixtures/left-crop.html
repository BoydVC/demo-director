<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Left crop</title>
<style>
  body { margin: 0; background: #0b1220; color: #e8eef8; font-family: system-ui, sans-serif; }
  .hero { margin: 0; padding: 28px 32px 0; font-size: 42px; font-weight: 800; letter-spacing: -0.03em; }
  .kick { margin: 10px 32px 0; font-size: 28px; font-weight: 650; color: #dbe7f5; }
  #side { position: absolute; right: 28px; top: 36px; width: 220px; }
  .note { color: #9fb0c9; margin-bottom: 10px; }
  button { background: #f97316; color: white; border: 0; border-radius: 12px; padding: 14px 18px; font-size: 18px; font-weight: 700; }
</style>
</head>
<body>
  <div class="hero" id="title">Maryland Men's Basketball</div>
  <p>Synthetic night for a Saturday session with orange cones ready today.</p>
  <div class="kick" id="kick">Keyboard Kickoff</div>
  <div id="side">
    <div class="note">Synthetic night</div>
    <button id="zoom-me">Box score</button>
  </div>
</body>
</html>
