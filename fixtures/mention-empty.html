<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Scores</title>
<style>
  body { margin: 0; background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; }
  header { padding: 20px 28px; background: #1e293b; }
  table { width: calc(100% - 56px); margin: 16px 28px; border-collapse: collapse; background: #1e293b; }
  td { padding: 12px 16px; border-bottom: 1px solid #334155; }
  tr:nth-child(odd) td { background: #243044; }
</style>
</head>
<body>
  <header><h1>Saturday scoreboard</h1></header>
  <p>Synthetic standings for the weekend session. One line says no scores yet, and the rest of the board is full.</p>
  <table>
    <tr><td>Team Alpha</td><td>24</td></tr>
    <tr><td>Team Beta</td><td>18</td></tr>
    <tr><td>Team Gamma</td><td>no scores yet</td></tr>
    <tr><td>Team Delta</td><td>31</td></tr>
    <tr><td>Team Epsilon</td><td>12</td></tr>
    <tr><td>Cones and pinnies are ready on the field.</td><td>ok</td></tr>
  </table>
</body>
</html>
