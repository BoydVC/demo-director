<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Typed fields</title>
<style>
  body { margin: 0; padding: 28px; background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; }
  input, button { font-size: 18px; padding: 10px 12px; margin-right: 8px; }
</style>
</head>
<body>
  <h1>Times archive</h1>
  <p>Synthetic times for a Saturday session with orange cones ready today.</p>
  <input id="d" type="date" placeholder="When">
  <input id="n" type="number" placeholder="Count">
  <button id="save" type="button">Save</button>
</body>
</html>
