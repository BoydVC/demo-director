<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weekend Planner demo</title>
<style>
  body { margin: 0; background: #0b1020; color: #e2e8f0; font-family: system-ui, sans-serif; }
  header { padding: 28px 32px 0; }
  h1 { margin: 0 0 6px; font-size: 28px; }
  h2 { margin: 0 0 12px; font-size: 18px; }
  p.note { color: #94a3b8; margin: 0; }
  section { padding: 20px 32px 36px; }
  .row { display: flex; gap: 16px; align-items: flex-start; }
  figure { margin: 0; background: #111827; border-radius: 12px; padding: 12px; flex: 1; min-width: 0; }
  img { width: 100%; height: auto; border-radius: 8px; background: #020617; display: block; margin-bottom: 8px; }
  figcaption { font-weight: 700; }
</style>
</head>
<body>
<header>
  <h1>Weekend Planner demo</h1>
  <p class="note">Synthetic data only. 16:9, 1:1, and 9:16 side by side.</p>
</header>
<section><h2>Weekend Planner demo</h2><div class="row"><figure><img src="still-16x9.png" alt="16:9 still"><img src="demo-16x9.gif" alt="16:9 demo"><figcaption>16:9</figcaption></figure><figure><img src="still-1x1.png" alt="1:1 still"><img src="demo-1x1.gif" alt="1:1 demo"><figcaption>1:1</figcaption></figure><figure><img src="still-9x16.png" alt="9:16 still"><img src="demo-9x16.gif" alt="9:16 demo"><figcaption>9:16</figcaption></figure></div></section>
</body>
</html>
