<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekend Planner — Demo Director</title>
<style>
  :root {
    --bg: #070b14;
    --line: #243049;
    --accent: #f97316;
    --text: #e8eefc;
    --muted: #93a0bd;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1000px 520px at 8% -10%, rgba(249,115,22,.20), transparent 55%),
      radial-gradient(820px 480px at 110% 0%, rgba(56,189,248,.14), transparent 50%),
      var(--bg);
  }
  header { padding: 56px 6vw 8px; max-width: 1200px; }
  .eyebrow {
    letter-spacing: .22em;
    font-size: 12px;
    color: var(--accent);
    font-weight: 700;
    margin: 0 0 12px;
  }
  h1 {
    font-size: clamp(36px, 5vw, 64px);
    line-height: .98;
    letter-spacing: -.035em;
    margin: 0 0 14px;
    font-weight: 700;
  }
  .sub { color: var(--muted); font-size: 17px; max-width: 38rem; margin: 0; }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 22px;
    padding: 36px 6vw 72px;
    align-items: start;
  }
  figure {
    margin: 0;
    background: linear-gradient(180deg, rgba(22,29,46,.92), rgba(12,16,28,.92));
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 14px;
    box-shadow: 0 24px 70px rgba(0,0,0,.35);
  }
  figcaption {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: baseline;
    padding: 4px 6px 12px;
    color: var(--muted);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  .tag { color: white; font-weight: 700; letter-spacing: .04em; }
  .frame {
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(420px 240px at 50% 42%, rgba(249,115,22,.16), transparent 70%),
      #090d16;
    border-radius: 14px;
    overflow: hidden;
    min-height: 180px;
    padding: 8px;
  }
  img { max-width: 100%; max-height: 480px; width: auto; height: auto; display: block; border-radius: 8px; }
  footer {
    padding: 0 6vw 48px;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: .04em;
  }
  @media (max-width: 980px) {
    .grid { grid-template-columns: 1fr; }
    img { max-height: 70vh; }
  }
</style>
</head>
<body>
<header>
  <p class="eyebrow">DEMO DIRECTOR</p>
  <h1>Weekend Planner</h1>
  <p class="sub">Synthetic data only. One shot list, three aspects, recorded in a real browser.</p>
</header>
<main class="grid">
<figure>
  <figcaption><span class="tag">16:9</span><span>10.5s · 126 frames · 682 KB</span></figcaption>
  <div class="frame"><img src="demo-16x9.gif" alt="16:9 demo"></div>
</figure>
<figure>
  <figcaption><span class="tag">1:1</span><span>10.5s · 126 frames · 655 KB</span></figcaption>
  <div class="frame"><img src="demo-1x1.gif" alt="1:1 demo"></div>
</figure>
<figure>
  <figcaption><span class="tag">9:16</span><span>10.5s · 126 frames · 620 KB</span></figcaption>
  <div class="frame"><img src="demo-9x16.gif" alt="9:16 demo"></div>
</figure>
</main>
<footer>Regenerated from the shot list.</footer>
</body>
</html>
